name: Elevvo Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: task-7/package.json

      - name: Install dependencies (Task 7 - Testing)
        working-directory: ./task-7
        run: npm install

      - name: Generate Prisma Client
        working-directory: ./task-7
        run: npx prisma generate

      - name: Run Tests
        working-directory: ./task-7
        run: npm test

      - name: Build TypeScript
        working-directory: ./task-7
        run: npx tsc --noEmit